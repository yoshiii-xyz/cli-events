[package]
name = "cli-events"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A bounded JSON Lines protocol and reference runner for CLI execution events"
license = "MIT"
repository = "https://github.com/joshiii-xyz/cli-events"
keywords = ["cli", "events", "jsonl", "process", "observability"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
